{% load static %}

<header class="sticky-top shadow">
    <nav class="navbar navbar-expand-xl navbar-dark bg-warning py-3">
        <div class="container-fluid px-lg-5">
            <a class="navbar-brand fw-bold text-dark" href="{% url 'home' %}">
                🕉️ Shubham Pandit Ji
            </a>
            <button class="navbar-toggler bg-dark" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto mb-2 mb-xl-0 align-items-center">
                    <li class="nav-item">
                        <a class="nav-link {% if request.resolver_match.url_name == 'home' %}active{% endif %}" href="{% url 'home' %}">Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {% if request.resolver_match.url_name == 'about' %}active{% endif %}" href="{% url 'about' %}">About</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {% if request.resolver_match.url_name == 'service' %}active{% endif %}" href="{% url 'service' %}">Services</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {% if request.resolver_match.url_name == 'heritage' %}active{% endif %}" href="{% url 'heritage' %}">Heritage Places</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {% if request.resolver_match.url_name == 'contact' %}active{% endif %}" href="{% url 'contact' %}">Contact</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {% if request.resolver_match.url_name == 'gallery' %}active{% endif %}" href="{% url 'gallery' %}">Gallery</a>
                    </li>
                </ul>
                <form class="d-flex ms-xl-4 my-2 my-xl-0" action="{% url 'global_search' %}" method="GET">
                    <input class="form-control me-2 navbar-search-input" type="search" name="search" id="searchInput" placeholder="Search pooja, places...">
                    <button class="btn btn-dark px-3" type="submit">
                        <i class="bi bi-search"></i>
                    </button>
                </form>
            </div>
        </div>
    </nav>
</header>
