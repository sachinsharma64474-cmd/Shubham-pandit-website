{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Shubham Pandit Ji{% endblock %}</title>

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="{% static 'css/loader.css' %}">
    <link rel="stylesheet" href="{% static 'css/scrolltop.css' %}">
    <link rel="stylesheet" href="{% static 'css/whatsapp.css' %}">
    <link rel="stylesheet" href="{% static 'css/booking.css' %}">
    <link rel="stylesheet" href="{% static 'css/heritage_detail.css' %}">
    <link rel="stylesheet" href="{% static 'css/pooja_detail.css' %}">
    <link rel="stylesheet" href="{% static 'css/service.css' %}">
    <link rel="stylesheet" href="{% static 'css/header.css' %}">
    <link rel="stylesheet" href="{% static 'css/footer.css' %}">
    <link rel="stylesheet" href="{% static 'css/home.css' %}">
    <link rel="stylesheet" href="{% static 'css/about.css' %}">
    <link rel="stylesheet" href="{% static 'css/hertage.css' %}">
    <link rel="stylesheet" href="{% static 'css/chatboot.css' %}">
    <link rel="stylesheet" href="{% static 'css/contact.css' %}">
    <link rel="stylesheet" href="{% static 'css/gallery.css' %}">
</head>
<body>

<!-- Loading Spinner -->
<div id="loader">
    <div class="spinner"></div>
    <h5 class="mt-3 text-white">Loading...</h5>
</div>

<!-- ================= HEADER ================= -->
{% include 'header.html' %}

<!-- ================= MAIN CONTENT ================= -->
<div class="content-wrapper">
    {% block content %}
    {% endblock %}
</div>

<!-- ================= FLOATING ACTION BUTTONS ================= -->
<a href="tel:+919131648738" class="chat_us" aria-label="Call Us">
    <i class="bi bi-telephone-fill"></i>
</a>

<a href="https://wa.me/919131648738?text=Namaste%20Pandit%20Ji,%20mujhe%20Pooja%20book%20karni%20hai." 
   class="whatsapp-float" 
   target="_blank" 
   rel="noopener noreferrer" 
   aria-label="WhatsApp">
    <i class="bi bi-whatsapp"></i>
</a>

<button id="topBtn" aria-label="Scroll to top">
    <i class="bi bi-arrow-up"></i>
</button>

<!-- ================= FOOTER ================= -->
{% include 'footer.html' %}

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<!-- Scripts -->
<script>
    // Scroll to Top Toggle
    const topBtn = document.getElementById("topBtn");
    window.addEventListener("scroll", function() {
        if (window.scrollY > 300) {
            topBtn.style.display = "flex";
        } else {
            topBtn.style.display = "none";
        }
    });
    topBtn.onclick = function() {
        window.scrollTo({ top: 0, behavior: "smooth" });
    };

    // Loader Hide
    window.addEventListener("load", function () {
        const loader = document.getElementById("loader");
        if (loader) {
            loader.classList.add("loader-hide");
            setTimeout(() => { loader.style.display = "none"; }, 500);
        }
    });
</script>

</body>
</html>
