<body>

<!-- Loading Spinner -->
<div id="loader">
    <div class="spinner"></div>
    <h5 class="mt-3 text-white">Loading...</h5>
</div>

<!-- ================= HEADER ================= -->
{% include 'header.html' %}

<!-- ================= MAIN CONTENT ================= -->
<div class="content-wrapper">
    {% block content %}
    {% endblock %}
</div>

<!-- ================= FLOATING ACTION BUTTONS ================= -->
<a href="tel:+919131648738" class="chat_us" aria-label="Call Us">
    <i class="bi bi-telephone-fill"></i>
</a>

<a href="https://wa.me/919131648738?text=Namaste%20Pandit%20Ji,%20mujhe%20Pooja%20book%20karni%20hai." 
   class="whatsapp-float" 
   target="_blank" 
   rel="noopener noreferrer" 
   aria-label="WhatsApp">
    <i class="bi bi-whatsapp"></i>
</a>

<button id="topBtn" aria-label="Scroll to top">
    <i class="bi bi-arrow-up"></i>
</button>

<!-- ================= FOOTER ================= -->
{% include 'footer.html' %}

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<!-- Scripts -->
<script>
    // Scroll to Top Toggle
    const topBtn = document.getElementById("topBtn");
    window.addEventListener("scroll", function() {
        if (window.scrollY > 300) {
            topBtn.style.display = "flex";
        } else {
            topBtn.style.display = "none";
        }
    });
    topBtn.onclick = function() {
        window.scrollTo({ top: 0, behavior: "smooth" });
    };

    // Loader Hide
    window.addEventListener("load", function () {
        const loader = document.getElementById("loader");
        if (loader) {
            loader.classList.add("loader-hide");
            setTimeout(() => { loader.style.display = "none"; }, 500);
        }
    });
</script>

</body>
</html>
